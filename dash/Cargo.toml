[package]
name = "cstan-dash"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "The cstan operator dashboard"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "cstan_dash"
path = "src/lib.rs"

[[bin]]
name = "cstan-dash"
path = "src/main.rs"

[dependencies]
capstan-wire = { path = "../rust/crates/wire" }
crossterm = "=0.28.1"
indexmap = { version = "=2.14.2", features = ["serde"] }
libc = "=0.2.190"
ratatui = "=0.29.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
signal-hook = "=0.3.18"
unicode-segmentation = "=1.13.3"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "=3.27.0"
