[package]
name = "cstan-dash"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "The cstan operator dashboard"
license = "MIT"
publish = false
build = "build.rs"

[lib]
name = "cstan_dash"
path = "src/lib.rs"

[[bin]]
name = "cstan-dash"
path = "src/main.rs"

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
