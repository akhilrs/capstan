[package]
name = "capstan-config"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "The capstan configuration reader and writer"
license = "MIT"
publish = false

[lib]
name = "capstan_config"
path = "src/lib.rs"

[dependencies]
capstan-wire = { path = "../wire" }
libc = "=0.2.190"
sha2 = "=0.10.9"
serde = "=1.0.229"
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
indexmap = "=2.14.2"

[dev-dependencies]
tempfile = "=3.27.0"
capstan-parity-overlay = { path = "../parity-overlay" }
