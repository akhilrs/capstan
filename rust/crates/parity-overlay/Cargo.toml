[package]
name = "capstan-parity-overlay"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Test support: the overlays that replace the expected output of a Node parity fixture case where Rust deliberately differs"
license = "MIT"
publish = false

[lib]
name = "capstan_parity_overlay"
path = "src/lib.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }

[dev-dependencies]
tempfile = "=3.27.0"
