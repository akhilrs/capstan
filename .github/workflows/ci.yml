name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# scripts/check.sh is the single gate and needs no node. Each job runs one of its stages, so CI and a local run are the
# same code; the jobs run in parallel. The release builds are not part of CI: the Release workflow builds and verifies
# the real binaries on tags (a local run: scripts/check.sh release).
jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # Some suites commit in temporary repositories and need an identity.
      - name: Git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      # Installs the channel and components named in rust/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          shared-key: rust
      - run: scripts/check.sh rust

  dash:
    name: dash (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      # dash/ has its own rust-toolchain.toml, identical to rust/'s (check.sh enforces it).
      - name: Rust toolchain
        working-directory: dash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dash
          shared-key: dash
      - run: scripts/check.sh dash

  tools:
    name: tools/release and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - name: Rust toolchain
        working-directory: tools/release
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/release
          shared-key: tools
      # cargo fmt, clippy -D warnings and cargo test for tools/release.
      - run: scripts/check.sh tools
      # smoke-binary.sh (skips without release binaries), the installer test, the release workflow and version
      # checks, and the test-map check.
      - run: scripts/check.sh scripts
