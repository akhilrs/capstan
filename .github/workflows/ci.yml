name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate: scripts/check.sh is the required check. It needs no node.
  check:
    name: check (scripts/check.sh)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Some suites commit in temporary repositories and need an identity.
      - name: Git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      # Installs the channel and components named in rust/rust-toolchain.toml.
      - name: Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            dash
            tools/release
      # cargo fmt, clippy -D warnings and cargo test for rust/, dash/ and tools/release; the smoke test of the release
      # binaries, the installer test, the release workflow and version checks, and the test-map check.
      - run: scripts/check.sh

  # Guards the frozen Node tree until plan D deletes it.
  node:
    name: frozen Node tree (build, test, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.6.x
          cache: npm
      # Some suites commit in temporary repositories and need an identity.
      - name: Git identity
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
      - run: npm ci
      # The Node-versus-Rust suites run the Rust binaries of rust/target/release (cstan, cstan-daemon, ledger-probe).
      - name: Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Build the Rust binaries
        working-directory: rust
        run: cargo build --release --locked
      - run: npm run build
      # The live suites (real Herdr and Claude) skip themselves when herdr is not installed, which it is not here.
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
